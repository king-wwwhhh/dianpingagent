server:
  port: 8081
spring:
  application:
    name: locallife
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
  redis:
    host: 127.0.0.1
    port: 6379
    password:
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  # ============ Kafka 消息队列（替代 Redis Stream 实现秒杀异步下单） ============
  kafka:
    bootstrap-servers: localhost:9092
    # 即使 Kafka broker 暂时不可用，也不阻塞应用启动（发送侧已退化为同步落库）
    admin:
      auto-create: false
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3
      acks: 1
      properties:
        linger.ms: 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: seckill-order-group
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      # broker 未启动时不要让应用启动失败
      missing-topics-fatal: false
      ack-mode: record
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.llp.entity # 别名扫描包
logging:
  level:
    com.llp: debug
  pattern:
    dateformat: mm:ss.SSS

# ============ 自定义配置（新增） ============
locallife:
  # 图片上传目录，对应 nginx 静态资源目录 html/hmdp/imgs
  upload-dir: C:/Users/joker/Desktop/changeheimadianping/nginx-1.18.0/html/hmdp/imgs/

# ============ Agent 智能体模块配置（新增，不影响原有功能） ============
agent:
  llm:
    # 是否启用真实大模型对话（兼容 OpenAI / ChatGPT 接口）。false 时使用离线规则对话，零外部依赖。
    enabled: true
    # 大模型接口地址，例如 https://api.openai.com/v1
    base-url: https://api.deepseek.com
    # 大模型 API Key
    api-key: sk-7121cfcbe9bc4bcd9fb3d370f0de5c28
    # 模型名称
    model: deepseek-v4-flash

  # 接口限流（防刷）：按会话/用户维度限制调用频率，保护大模型接口不被滥用
  rate-limit:
    enabled: true
    # 时间窗口内允许的最大请求数
    max-requests: 10
    # 时间窗口（秒）
    window-seconds: 60